# Alembic configuration for the Telegram physical-goods shop (sync SQLAlchemy).
#
# The database URL is NOT set here. env.py resolves it at runtime from
# bot.database.dsn.dsn() (which honours the Docker/manual deploy split), or from
# a `sqlalchemy.url` passed programmatically (used by the test smoke-check).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Logging is intentionally minimal; env.py does not call fileConfig so the bot's
# own logging setup is never clobbered when migrations run in-process at startup.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
